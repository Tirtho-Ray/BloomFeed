services:
  db:
    image: postgres:15-alpine
    container_name: oneView_DB
    restart: always
    ports:
      - "5433:5432" 
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: oneView 
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - app_network
  redis_cache:
    image: redis:7-alpine
    container_name: oneViewRedis_server 
    restart: always
    ports:
      - "6375:6379" 
    volumes:
      - redis_data_dev:/data 
    networks:
      - app_network
 
networks:
  app_network:
    driver: bridge

volumes:
  postgres_data_dev:
  redis_data_dev:
